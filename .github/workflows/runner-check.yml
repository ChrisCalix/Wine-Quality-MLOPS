# TEMPORAL: comprueba que el runner autohospedado recoge jobs y alcanza el clúster
# (PATH de servicio, kubectl, contexto docker-desktop y Docker). Solo lee, no cambia nada.
# Se dispara al empujar la rama a/f8-ci; borrar este archivo antes de mergear a main.
name: Runner check (temporal)

on:
  push:
    branches: [a/f8-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Runner autohospedado alcanza el clúster
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Entorno del runner
        run: |
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          echo "usuario:  $(whoami)"
          echo "contexto: $(kubectl config current-context)"
          echo "docker:   $(docker version --format '{{.Server.Version}}')"
          kubectl -n wine-mlops get deploy wine-api
