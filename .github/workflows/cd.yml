# CD: si el CI pasó en main, se construye la imagen, se prueba y se publica en ghcr.io
# con el SHA del commit (REQ-CICD-02). El despliegue en el clúster local de Docker
# Desktop lo hace scripts/deploy_local.sh, porque un runner de GitHub no alcanza ese
# clúster. Ver docs/CICD.md.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:   # publicar a mano la imagen de main

permissions:
  contents: read
  packages: write   # publicar en ghcr.io con el GITHUB_TOKEN (sin secretos)

jobs:
  cd:
    name: CD - publicar imagen
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Descargar el código del commit que pasó el CI
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Nombre de la imagen (ghcr.io exige minúsculas)
        run: echo "IMAGEN=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Construir la imagen
        run: >
          docker build
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=$SHA
          -t $IMAGEN:$SHA -t $IMAGEN:latest .

      - name: Probar la imagen antes de publicarla
        # Sin servidor MLflow no hay modelo: el servicio debe estar vivo (/health 200)
        # y declararse no listo (/ready 503).
        run: |
          docker run -d --name api -p 8000:8000 $IMAGEN:$SHA
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://localhost:8000/health
          ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ready)
          if [ "$ready" != "503" ]; then
            echo "::error::/ready debía responder 503 sin modelo y respondió $ready"
            exit 1
          fi

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar la imagen
        run: docker push --all-tags $IMAGEN

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "\`$IMAGEN:$SHA\`"
            echo
            echo "Para desplegarla en el clúster local, desde la raíz del repositorio:"
            echo
            echo "\`\`\`bash"
            echo "scripts/deploy_local.sh $SHA"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
