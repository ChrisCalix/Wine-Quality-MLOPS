apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-ui
  namespace: wine-mlops
  labels:
    app: wine-ui
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wine-ui
  template:
    metadata:
      labels:
        app: wine-ui
    spec:
      containers:
        - name: ui
          image: wine-ui:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # nginx reenvía /api al Service de la API por su nombre DNS interno, nunca a localhost.
            - name: API_UPSTREAM
              value: http://wine-api.wine-mlops.svc.cluster.local:8080
            - name: DNS_RESOLVER
              value: kube-dns.kube-system.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
