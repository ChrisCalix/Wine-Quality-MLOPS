apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wine-api
  namespace: wine-mlops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wine-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # % de requests.cpu (100m) => ~60m por pod
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2                 # como máximo +2 pods cada 30 s: cada pod carga el modelo en memoria
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1                 # baja de a 1 pod cada 30 s
          periodSeconds: 30
