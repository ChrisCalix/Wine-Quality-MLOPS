# Carga sostenida contra el Service (dentro del clúster, así pasa por kube-proxy).
#   kubectl apply -f k8s/load-test/load-test-job.yaml
#   kubectl -n wine-mlops delete job wine-load-test
apiVersion: batch/v1
kind: Job
metadata:
  name: wine-load-test
  namespace: wine-mlops
spec:
  parallelism: 2
  completions: 2
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: wine-load-test
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: wine-api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET_URL
              value: http://wine-api:8080/predict
            - name: DURATION_SECONDS
              value: "240"
            - name: THREADS
              value: "8"
          command:
            - python
            - -c
            - |
              import json, os, threading, time, urllib.request

              url = os.environ["TARGET_URL"]
              end = time.time() + int(os.environ["DURATION_SECONDS"])
              body = json.dumps({"records": [{
                  "fixed_acidity": 7.4, "volatile_acidity": 0.7, "citric_acid": 0.0,
                  "residual_sugar": 1.9, "chlorides": 0.076, "free_sulfur_dioxide": 11.0,
                  "total_sulfur_dioxide": 34.0, "density": 0.9978, "ph": 3.51,
                  "sulphates": 0.56, "alcohol": 9.4}]}).encode()
              ok = fail = 0
              lock = threading.Lock()

              def worker():
                  global ok, fail
                  while time.time() < end:
                      req = urllib.request.Request(
                          url, body, {"Content-Type": "application/json"})
                      try:
                          urllib.request.urlopen(req, timeout=10).read()
                          with lock:
                              ok += 1
                      except Exception:
                          with lock:
                              fail += 1

              threads = [threading.Thread(target=worker)
                         for _ in range(int(os.environ["THREADS"]))]
              [t.start() for t in threads]
              [t.join() for t in threads]
              print(f"peticiones ok={ok} fallidas={fail}")
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
