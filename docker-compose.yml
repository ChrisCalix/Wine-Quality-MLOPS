services:
  mlflow:
    image: python:3.14.2-slim
    working_dir: /workspace
    environment:
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: "5000"
    command: >-
      sh -c "pip install --no-cache-dir mlflow==3.17.2 &&
      mlflow server
      --backend-store-uri sqlite:////mlflow_data/mlflow.db
      --artifacts-destination /mlflow_data/artifacts
      --host 0.0.0.0
      --port 5000"
    ports:
      - "5678:5000"
    volumes:
      - mlflow_data:/mlflow_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mlflow_data:
