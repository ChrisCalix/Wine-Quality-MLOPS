services:
  api:
    build: .
    image: wine-api:local
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/wine-premium-classifier@champion
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
  mlflow:
    image: python:3.14.2-slim
    working_dir: /workspace
    environment:
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: "5000"
    command: >-
      sh -c "pip install --no-cache-dir mlflow==3.17.2 &&
      mlflow server
      --backend-store-uri sqlite:////mlflow_data/mlflow.db
      --artifacts-destination /mlflow_data/artifacts
      --host 0.0.0.0
      --allowed-hosts localhost,127.0.0.1,mlflow,mlflow:5000,host.docker.internal,host.docker.internal:5678
      --workers 1
      --port 5000"
    ports:
      - "5678:5000"
    volumes:
      - mlflow_data:/mlflow_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 12

volumes:
  mlflow_data:
