<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wine Quality · Potencial premium</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header text-white">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2 py-3">
      <div>
        <h1 class="h4 mb-0">Wine Quality</h1>
        <div class="small opacity-75">¿Este lote de tinto tiene potencial premium?</div>
      </div>
      <span id="api-badge" class="badge rounded-pill text-bg-secondary" role="status">Conectando…</span>
    </div>
  </header>

  <main class="container py-4">
    <div class="row g-4">
      <section class="col-lg-7" aria-labelledby="form-title">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-1">
              <h2 id="form-title" class="h5 mb-0">Análisis de laboratorio</h2>
              <div id="preset-bar" class="btn-group" role="group" aria-label="Ejemplos"></div>
            </div>
            <p class="text-body-secondary small mb-4">
              Escribe las once mediciones de la muestra o carga un ejemplo.
            </p>
            <form id="wine-form" novalidate>
              <div id="fields" class="row row-cols-1 row-cols-sm-2 g-3"></div>
              <div class="d-flex flex-wrap gap-2 mt-4">
                <button id="btn-evaluate" type="submit" class="btn btn-wine px-4">Evaluar</button>
                <button id="btn-clear" type="button" class="btn btn-outline-secondary">Limpiar</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section class="col-lg-5" aria-labelledby="result-title">
        <div class="card shadow-sm border-0 sticky-lg-top result-card">
          <div class="card-body p-4">
            <h2 id="result-title" class="h5 mb-3">Resultado</h2>
            <div id="result" aria-live="polite"></div>
            <div id="history"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="container pb-4 small text-body-secondary">
    Modelo entrenado con vinos tintos de Vinho Verde (UCI Wine Quality, id 186). Servido desde MLflow Model Registry.
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
