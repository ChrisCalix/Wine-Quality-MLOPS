# Plantilla de nginx para la UI. La imagen sustituye ${DNS_RESOLVER} y ${API_UPSTREAM} al arrancar
# (valores por defecto del clúster en ui/Dockerfile); el resto de "$variables" son de nginx.
#
#  /         -> archivos estáticos de la UI
#  /api/...  -> API de inferencia (Service wine-api), sin el prefijo /api
#  /healthz  -> sonda de salud del contenedor

# El upstream se resuelve en cada petición (no al arrancar), así nginx no cae si la API
# todavía no existe y sigue funcionando si los pods de la API cambian de IP.
resolver ${DNS_RESOLVER} valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream ${API_UPSTREAM};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;   # sin caché: los módulos de la UI no llevan huella en el nombre
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}
